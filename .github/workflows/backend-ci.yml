name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # cache: 'npm' # Ignorado até gerar o package-lock.json do workspace

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        
      # - name: Test
      #   run: npm run test
